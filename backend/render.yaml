- name: mercado-financeiro-backend
  type: web
  env: node
  buildCommand: npm install && npx prisma generate && npm run build
  startCommand: npm run start
  healthCheckPath: /health
  envVars:
    - key: DATABASE_URL
      sync: false
    - key: DIRECT_URL
      sync: false
    - key: JWT_SECRET
      sync: false
    - key: REDIS_URL
      sync: false
    - key: CORS_ORIGINS
      value: https://mercado-financeiro.vercel.app,http://localhost:3000
    - key: PORT
      value: 10000