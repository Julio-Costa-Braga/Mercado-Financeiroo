- name: mercado-financeiro-backend
  type: web
  env: node
  buildCommand: npm install && npx prisma generate && npm run build
  startCommand: npm run start
  healthCheckPath: /health
  envVars:
    - key: DATABASE_URL
      sync: false
    - key: DIRECT_URL
      sync: false
    - key: JWT_SECRET
      sync: false
    - key: REDIS_URL
      sync: false
    - key: CORS_ORIGINS
      value: https://mercado-financeiroo.vercel.app,http://localhost:3000,http://localhost:3001
    - key: FRONTEND_URL
      value: https://mercado-financeiroo.vercel.app
    - key: STRIPE_SECRET_KEY
      sync: false
    - key: STRIPE_WEBHOOK_SECRET
      sync: false
    - key: GEMINI_API_KEY
      sync: false
    - key: OPENAI_API_KEY
      sync: false
    - key: PORT
      value: 10000