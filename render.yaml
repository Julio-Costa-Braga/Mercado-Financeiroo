services:
  - name: mercado-financeiro-backend
    type: web
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        value: https://mercado-financeiro.vercel.app
